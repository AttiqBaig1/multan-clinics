<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multan Health & Clinic Demos</title>
    <script type="text/javascript">
      // GitHub Pages SPA Redirect Handler with 100% Parameter Preservation
      (function() {
        var l = window.location;
        var pathname = l.pathname;
        
        // Extract all segments
        var segments = pathname.split('/').filter(Boolean);
        
        // If repo path exists (e.g. /repo-name/client-slug or /client-slug)
        var slug = segments.pop() || '';
        var basePath = '/' + segments.join('/');
        if (basePath === '/') basePath = '';
        
        // Preserve all existing query parameters
        var search = l.search ? l.search.replace(/^\?/, '') : '';
        var searchParams = new URLSearchParams(search);
        
        if (slug && slug !== 'index.html' && slug !== '404.html') {
          if (!searchParams.has('client')) {
            searchParams.set('client', slug);
          }
        }
        
        var queryStr = searchParams.toString();
        var targetUrl = l.protocol + '//' + l.host + basePath + '/' + (queryStr ? '?' + queryStr : '') + (l.hash ? l.hash : '');
        window.location.replace(targetUrl);
      })();
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0b1120;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .loader {
        text-align: center;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(245, 158, 11, 0.2);
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px auto;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <div class="spinner"></div>
      <p style="font-size: 14px; color: #94a3b8;">Loading Clinic Demo...</p>
    </div>
  </body>
</html>
